name: China Flight Delay Monitor

on:
  schedule:
    # Every 10 minutes (GitHub may occasionally delay scheduled runs)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VARIFLIGHT_API_KEY: ${{ secrets.VARIFLIGHT_API_KEY }}
      DELAY_THRESHOLD_MINUTES: '120'
      MONITOR_ROUTES: 'CAN-PEK,CAN-SHA,CAN-PVG,CAN-SZX,CAN-CTU,CAN-HGH'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Check flights through VariFlight MCP
        run: python flight_monitor.py
