name: China Flight Delay Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VARIFLIGHT_API_KEY: ${{ secrets.VARIFLIGHT_API_KEY }}
      VARIFLIGHT_MCP_URL: https://ai.variflight.com/servers/aviation/mcp
      DELAY_THRESHOLD_MINUTES: '230'
      MONITOR_AIRLINES: 'CZ'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore today's CZ flight cache
        id: flight-cache
        uses: actions/cache@v4
        with:
          path: data/cz_flights_today.json
          key: cz-flights-${{ format('{0}-{1}-{2}', github.run_started_at, github.run_id, github.run_attempt) }}
          restore-keys: |
            cz-flights-${{ github.run_started_at }}
            cz-flights-

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Check CZ flights through VariFlight MCP
        run: python flight_monitor.py
