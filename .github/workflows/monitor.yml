name: China Flight Delay Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VARIFLIGHT_API_KEY: ${{ secrets.VARIFLIGHT_API_KEY }}
      VARIFLIGHT_MCP_URL: https://ai.variflight.com/servers/aviation/mcp
      DELAY_THRESHOLD_MINUTES: '120'
      MONITOR_AIRLINES: 'CZ'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set Beijing cache date
        run: echo "CACHE_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore today's CZ flight cache
        uses: actions/cache@v4
        with:
          path: data/cz_flights_today.json
          key: cz-flights-${{ env.CACHE_DATE }}
          restore-keys: |
            cz-flights-

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Check CZ flights through VariFlight MCP
        run: python flight_monitor.py

      - name: Verify and save CZ cache
        if: success()
        run: |
          test -s data/cz_flights_today.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/cz_flights_today.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          flights = obj.get("flights", [])
          if not obj.get("date") or not isinstance(flights, list) or not flights:
              raise SystemExit("CZ cache is missing, invalid, or empty")
          print(f"CACHE_OK date={obj['date']} flights={len(flights)} updated_at={obj.get('updated_at','')}")
          PY
